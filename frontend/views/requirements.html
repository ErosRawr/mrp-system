  <!-- REQUERIMIENTOS -->
  <div class="view" id="view-requirements">
    <h1>Requerimientos de material</h1>
    <p class="view-desc">Cálculo puro de material por equipo, en base al rendimiento. Sin fechas ni capacidad (eso corresponde a la planeación mensual).</p>

    <div class="panel">
      <div class="form-row">
        <div class="field"><label>Pedido</label><select id="reqOrder"></select></div>
        <button class="btn" id="btnCalcReq">Calcular</button>
      </div>
      <div class="status" id="reqStatus"></div>
    </div>

    <div class="summary-box" id="reqSummary" style="display:none;"></div>

    <table>
      <thead>
        <tr>
          <th>Equipo</th><th class="num">Seq</th>
          <th class="num">Ton. salida</th><th class="num">Ton. entrada</th>
          <th class="num">Rend.</th><th class="num">Cap. mensual</th><th class="num">Cap. semanal</th>
        </tr>
      </thead>
      <tbody id="reqBody"></tbody>
    </table>
  </div>
