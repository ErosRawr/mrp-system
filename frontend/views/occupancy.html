  <!-- OCUPACION -->
  <div class="view" id="view-occupancy">
    <h1>Ocupación por equipo</h1>
    <p class="view-desc">Porcentaje de capacidad semanal utilizada, para todos los equipos de la ruta durante un mes.</p>

    <div class="panel">
      <div class="form-row">
        <div class="field"><label>Año</label><input id="occYear" type="number" value="2026" /></div>
        <div class="field"><label>Mes</label><input id="occMonth" type="number" min="1" max="12" value="9" /></div>
        <button class="btn" id="btnGetOccupancy">Ver todos los equipos</button>
      </div>
      <div class="status" id="occStatus"></div>
    </div>

    <div id="occAllTeams"></div>
  </div>
