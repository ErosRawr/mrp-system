  <!-- EQUIPOS -->
  <div class="view" id="view-teams">
    <h1>Equipos</h1>
    <p class="view-desc">La ruta de proceso: cada equipo tiene una capacidad mensual, una disponibilidad en semanas, y un rendimiento.</p>

    <div class="panel">
      <div class="panel-title">Nuevo equipo</div>
      <div class="form-row">
        <div class="field"><label>Nombre</label><input id="teamName" /></div>
        <div class="field"><label>Secuencia</label><input id="teamSeq" type="number" min="1" /></div>
        <div class="field"><label>Capacidad mensual</label><input id="teamCap" type="number" step="0.01" /></div>
        <div class="field"><label>Semanas disponibles</label><input id="teamWeeks" type="number" min="1" value="4" /></div>
        <div class="field"><label>Rendimiento</label><input id="teamEff" type="number" step="0.01" min="0" max="1" value="0.95" /></div>
        <button class="btn" id="btnCreateTeam">Crear</button>
      </div>
      <div class="status" id="teamStatus"></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nombre</th><th class="num">Seq</th>
          <th class="num">Cap. mensual</th><th class="num">Semanas</th><th class="num">Cap. semanal</th><th class="num">Rendimiento</th>
        </tr>
      </thead>
      <tbody id="teamsBody"></tbody>
    </table>
  </div>
