  <!-- CALENDARIO -->
  <div class="view" id="view-calendar">
    <h1>Calendario de disponibilidad</h1>
    <p class="view-desc">Vista de todas las semanas del año para un equipo, con sus excepciones marcadas.</p>

    <div class="panel">
      <div class="form-row">
        <div class="field"><label>Equipo</label><select id="calTeam"></select></div>
        <div class="field"><label>Año</label><input id="calYear" type="number" value="2026" /></div>
        <button class="btn" id="btnLoadCalendar">Ver</button>
      </div>
      <div class="status" id="calStatus"></div>
    </div>

    <div class="cal-grid" id="calGrid"></div>
  </div>
