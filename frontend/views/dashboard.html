  <!-- DASHBOARD -->
  <div class="view active" id="view-dashboard">
    <h1>Dashboard</h1>
    <p class="view-desc">Estado general de la planta para el mes seleccionado.</p>

    <div class="panel">
      <div class="form-row">
        <div class="field"><label>Año</label><input id="dashYear" type="number" value="2026" /></div>
        <div class="field"><label>Mes</label><input id="dashMonth" type="number" min="1" max="12" value="9" /></div>
        <button class="btn" id="btnLoadDashboard">Actualizar</button>
      </div>
      <div class="status" id="dashStatus"></div>
    </div>

    <div class="kpi-grid" id="kpiGrid"></div>

    <div class="dash-section-title">Ocupación por equipo (resumen)</div>
    <table>
      <thead><tr><th>Equipo</th><th class="num">Ocupación promedio</th><th>Semana más ocupada</th></tr></thead>
      <tbody id="dashOccBody"></tbody>
    </table>

    <div class="dash-section-title">Vista trimestral</div>
    <div class="panel">
      <div class="form-row">
        <div class="field"><label>Año</label><input id="qYear" type="number" value="2026" /></div>
        <div class="field">
          <label>Trimestre</label>
          <select id="qQuarter">
            <option value="1">Q1 (Ene-Mar)</option>
            <option value="2">Q2 (Abr-Jun)</option>
            <option value="3" selected>Q3 (Jul-Sep)</option>
            <option value="4">Q4 (Oct-Dic)</option>
          </select>
        </div>
        <button class="btn" id="btnLoadQuarter">Cargar trimestre</button>
      </div>
      <div class="status" id="qStatus"></div>
    </div>

    <div class="chart-block">
      <div class="chart-title">Pedidos a tiempo vs. atrasados por mes</div>
      <div id="qOrdersChart"></div>
    </div>

    <div class="chart-block">
      <div class="chart-title">Ocupación promedio de planta por mes</div>
      <div id="qOccChart"></div>
    </div>
  </div>
